<div id="zr-extensions-plugin" lang="zh-CN" data-start="plugins" aria-label="主题与插件统一设计">
  <style>
    #zr-extensions-plugin {
      --zr-primary: light-dark(#1677ff, #69aaff);
      --zr-primary-fill: light-dark(#1677ff, #246edb);
      --zr-on-primary: #fff;
      --zr-selected: light-dark(#eaf3ff, #192d48);
      --zr-bg: light-dark(#f5f6f8, #13161b);
      --zr-surface: light-dark(#fff, #1c2027);
      --zr-subtle: light-dark(#f8f9fb, #242a33);
      --zr-text: light-dark(#242a33, #e8ecf3);
      --zr-muted: light-dark(#697382, #a0aabb);
      --zr-line: light-dark(#e5e8ed, #333a46);
      --zr-green: light-dark(#27824d, #7ccea0);
      --zr-green-bg: light-dark(#eff8f2, #20382c);

      --zr-radius-sm: calc(var(--zr-radius) * .6);

      color: var(--zr-text);

      width: 100%;
      container-type: inline-size;

    #zr-extensions-plugin * { box-sizing: border-box; }
    #zr-extensions-plugin [hidden] { display: none !important; }
    #zr-extensions-plugin button, #zr-extensions-plugin input, #zr-extensions-plugin select { font: inherit; }
    #zr-extensions-plugin button { cursor: pointer; }
    #zr-extensions-plugin button:disabled { cursor: not-allowed; opacity: .5; }
    #zr-extensions-plugin button:focus-visible, #zr-extensions-plugin input:focus-visible, #zr-extensions-plugin select:focus-visible { outline: 2px solid var(--zr-primary); outline-offset: 3px; }

    #zr-extensions-plugin .zr-next-side { background: var(--zr-text); color: var(--zr-surface); padding: 15px 9px; font-size: 11px; text-align: center; }

    #zr-extensions-plugin .zr-cover-simple .zr-cover-page { text-align: center; padding-top: 20px; }
    #zr-extensions-plugin .zr-cover-simple .zr-mini-title { font-family: Georgia, serif; font-size: 19px; }

    #zr-extensions-plugin .zr-plugin-table { border: 1px solid var(--zr-line); border-radius: var(--zr-radius-lg); overflow: hidden; background: var(--zr-surface); }

    #zr-extensions-plugin .zr-list-info { display: flex; gap: 13px; min-width: 0; align-items: center; }
    #zr-extensions-plugin .zr-list-copy { min-width: 0; }
    #zr-extensions-plugin .zr-list-name { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    #zr-extensions-plugin .zr-plugin-icon svg { width: 21px; height: 21px; }
    #zr-extensions-plugin .zr-services { display: flex; gap: 5px; flex-wrap: wrap; }

    #zr-extensions-plugin .zr-row-actions .zr-button { padding: 6px 7px; }
    #zr-extensions-plugin .zr-plugin-card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }

  <div class="zr-shell">

  <script>
    (() => {
      const root = document.getElementById('zr-extensions-plugin');
      const query = (selector) => root.querySelector(selector);
      const icon = (name) => `<i data-lucide="${name}" aria-hidden="true"></i>`;
      const themes = [
        {id:'default', name:'ZrLog 默认主题', author:'ZrLog', url:'https://www.zrlog.com/', version:'1.0', desc:'简洁清晰的阅读体验，让内容成为主角。', tags:['简洁','响应式'], cover:'default', active:true, removable:false},
        {id:'fluid', name:'Fluid', author:'Fluid', url:'https://hexo.fluid-dev.com/', version:'1.0', desc:'沉浸式首页与舒适排版，记录生活与灵感。', tags:['图文','响应式'], cover:'fluid', active:false, removable:true},
        {id:'next', name:'NexT', author:'NexT', url:'https://theme-next.js.org/', version:'1.0', desc:'经典双栏布局，适合有条理地分享知识。', tags:['极简','双栏'], cover:'next', active:false, removable:true},
        {id:'simple', name:'Simple', author:'ZrLog', url:'https://www.zrlog.com/', version:'1.0', desc:'留白与文字之间，保留写作最初的样子。', tags:['文字','轻量'], cover:'simple', active:false, removable:true}
      ];
      const plugins = [
        {id:'common', name:'基础服务', shortName:'common', desc:'为站点提供通用能力与插件基础服务。', services:['基础服务'], icon:'blocks', required:true},
        {id:'mail', name:'邮件服务', shortName:'mail', desc:'配置邮件发送，用于评论通知等站点消息。', services:['邮件发送'], icon:'mail', required:false},
        {id:'backup', name:'数据备份', shortName:'backup-sql-file', desc:'备份站点数据，管理和下载历史备份。', services:['数据备份'], icon:'database-backup', required:false},
        {id:'reminder', name:'消息提醒', shortName:'reminder', desc:'及时接收站点消息与待处理事项提醒。', services:['消息通知'], icon:'bell', required:false},
        {id:'static', name:'静态化增强', shortName:'static-plus', desc:'管理静态资源生成，改善站点访问体验。', services:['静态生成'], icon:'zap', required:false},
        {id:'travel', name:'开往', shortName:'travel', desc:'连接独立博客，发现更多有趣的站点。', services:['站点互联'], icon:'compass', required:false}
      ];
      const state = {page:root.dataset.start, view:root.dataset.start === 'themes' ? 'grid' : 'list', filter:'all', search:'', preview:null};
      const design = {accent:'#1677ff', radius:8, spacing:'comfortable'};
      function icons() { if (globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}}); }
      function button(label, action, item = '', style = '', glyph = '') {
        return `<button type="button" class="zr-button ${style}" data-action="${action}" data-item="${item}">${glyph ? icon(glyph) : ''}${label}</button>`;
      }
      function badge(label, style = '', glyph = '') { return `<span class="zr-badge ${style}">${glyph ? icon(glyph) : ''}${label}</span>`; }
      function cover(theme) {
        const contents = {
          default:'<div class="zr-cover-page"><div class="zr-mini-nav"><span>ZrLog</span><span>记录 · 分享</span></div><div class="zr-mini-layout"><div><div class="zr-mini-title">把日常写成故事</div><div class="zr-mini-text">记录生活，也记录成长。</div><div class="zr-mini-line"></div><div class="zr-mini-line"></div></div><div><div class="zr-mini-avatar">Z</div><div class="zr-mini-line"></div><div class="zr-mini-line"></div></div></div></div>',
          fluid:'<div class="zr-landscape"><h3>山海之间</h3><p>生活的每一步，都值得记录</p></div>',
          next:'<div class="zr-cover-page"><div class="zr-next-side">NexT<div class="zr-mini-line"></div><div class="zr-mini-line"></div><div class="zr-mini-line"></div></div><div class="zr-next-article"><div class="zr-mini-title">保持好奇，持续书写</div><div class="zr-mini-text">关于代码、阅读与生活</div><div class="zr-mini-line"></div><div class="zr-mini-line"></div><div class="zr-mini-line"></div></div></div>',
          simple:'<div class="zr-cover-page"><div class="zr-mini-title">Less, but better.</div><div class="zr-mini-text">一些文字，一些想法。</div><div class="zr-mini-line"></div><div class="zr-mini-line"></div><div class="zr-mini-line"></div></div>'
        };
        return `<div class="zr-cover zr-cover-${theme.cover}" role="img" aria-label="${theme.name}的示意预览">${theme.active ? badge('已应用','zr-success','check') : state.preview === theme.id ? badge('预览中','zr-blue','eye') : ''}${contents[theme.cover]}</div>`;
      }
      function themeActions(theme) {
        if (theme.active) return button('配置','config',theme.id,'zr-soft','settings-2');
        return button('预览','preview',theme.id,'','eye') + button('应用','apply',theme.id,'zr-soft');
      }
      function themeCard(theme) {
        return `<article class="zr-card ${theme.active ? 'zr-active' : ''}">${cover(theme)}<div class="zr-card-content"><div class="zr-card-title"><div class="zr-card-name"><h3>${theme.name}</h3>${theme.removable ? '' : badge('内置','','shield-check')}</div><span class="zr-version">v${theme.version}</span></div><p class="zr-card-desc">${theme.desc}</p><div class="zr-metadata">${authorLink(theme)}<span>·</span>${theme.tags.map(tag => badge(tag)).join('')}</div></div><div class="zr-card-footer"><div class="zr-actions">${themeActions(theme)}</div><div class="zr-actions">${theme.active ? '<span class="zr-status-note">当前站点主题</span>' : `<button type="button" class="zr-button zr-quiet zr-icon" data-action="config" data-item="${theme.id}" aria-label="配置${theme.name}">${icon('settings-2')}</button>${theme.removable ? `<button type="button" class="zr-button zr-icon" data-action="remove" data-item="${theme.id}" aria-label="删除${theme.name}">${icon('trash-2')}</button>` : `<button type="button" class="zr-button zr-icon" disabled aria-label="内置主题不可删除">${icon('lock-keyhole')}</button>`}`}</div></div></article>`;
      }
      function authorLink(theme) {
        return theme.url ? `<a class="zr-author-link" href="${theme.url}" target="_blank" rel="noopener noreferrer" aria-label="访问 ${theme.author} 的主页（新标签页）">${theme.author}${icon('external-link')}</a>` : `<span>${theme.author}</span>`;
      }
      function pluginActions(plugin) {
        return button('管理','config',plugin.id,'zr-quiet','settings-2') + (plugin.required ? `<button type="button" class="zr-button zr-icon" disabled aria-label="系统插件不可卸载">${icon('lock-keyhole')}</button>` : `<button type="button" class="zr-button zr-icon" data-action="remove" data-item="${plugin.id}" aria-label="卸载${plugin.name}">${icon('trash-2')}</button>`);
      }
      function pluginCard(plugin) {
        return `<article class="zr-card zr-plugin-card"><div class="zr-card-content"><div class="zr-plugin-card-top"><div class="zr-plugin-icon">${icon(plugin.icon)}</div><h3>${plugin.name}</h3>${plugin.required ? badge('系统') : ''}</div><p class="zr-card-desc">${plugin.desc}</p><div class="zr-services">${plugin.services.map(service => badge(service)).join('')}</div></div><div class="zr-card-footer"><span class="zr-status-note">${plugin.shortName}</span><div class="zr-row-actions">${pluginActions(plugin)}</div></div></article>`;
      }
      function listRow(item) {
        const isTheme = state.page === 'themes';
        return `<article class="zr-list-row"><div class="zr-list-info"><div class="zr-plugin-icon">${icon(isTheme ? 'palette' : item.icon)}</div><div class="zr-list-copy"><div class="zr-list-name"><h3>${item.name}</h3>${isTheme ? `${item.removable ? '' : badge('内置','','shield-check')}${item.active ? badge('已应用','zr-success') : state.preview === item.id ? badge('预览中','zr-blue') : ''}` : item.required ? badge('系统') : ''}</div><p class="zr-list-desc">${item.desc}</p>${isTheme ? `<div class="zr-metadata">${authorLink(item)}</div>` : ''}</div></div><div class="zr-services">${isTheme ? `<span class="zr-version">v${item.version}</span>` : item.services.map(service => badge(service)).join('')}</div><div class="zr-row-actions">${isTheme ? themeActions(item) : pluginActions(item)}</div></article>`;
      }
      function renderResults() {
        const isTheme = state.page === 'themes';
        const data = isTheme ? themes : plugins;
        const selected = data.filter(item => {
          const haystack = [item.name,item.author,item.shortName,item.desc,...(item.services || []),...(item.tags || [])].join(' ').toLowerCase();
          return haystack.includes(state.search.trim().toLowerCase()) && (state.filter === 'all' || (state.filter === 'active' && item.active) || (state.filter === 'preview' && item.id === state.preview) || (state.filter === 'removable' && (isTheme ? item.removable : !item.required)) || (state.filter === 'system' && (isTheme ? !item.removable : item.required)));
        });
        if (!selected.length) query('[data-results]').innerHTML = `<div class="zr-empty">${icon('search')}<p>没有找到匹配的${isTheme ? '主题' : '插件'}</p>${button('清除筛选','clear')}</div>`;
        else if (state.view === 'grid') query('[data-results]').innerHTML = `<div class="zr-grid">${selected.map(isTheme ? themeCard : pluginCard).join('')}</div>`;
        else query('[data-results]').innerHTML = `<div class="zr-plugin-table"><div class="zr-list-head"><span>${isTheme ? '主题' : '插件'}信息</span><span class="zr-service-heading">${isTheme ? '版本' : '提供的服务'}</span><span>操作</span></div>${selected.map(listRow).join('')}</div>`;
        query('[data-summary]').textContent = `显示 ${selected.length} / ${data.length} 个${isTheme ? '主题' : '插件'}`;
        query('[data-footer-note]').textContent = isTheme ? '应用主题后，博客外观随之更新' : '系统插件为站点提供必要服务';
        root.querySelectorAll('[data-view]').forEach(element => element.setAttribute('aria-pressed', String(element.dataset.view === state.view)));
        query('[data-count]').textContent = `已安装 ${data.length}`;
        const notice = query('[data-notice]');
        notice.hidden = !isTheme || !state.preview;
        if (!notice.hidden) notice.innerHTML = icon('eye') + `<span>正在预览 ${themes.find(theme => theme.id === state.preview).name}，访客仍看到当前已应用主题</span>`;
        icons();
      }
      function renderPage() {
        const isTheme = state.page === 'themes';
        query('[data-title]').textContent = isTheme ? '主题' : '插件';
        query('[data-breadcrumb]').textContent = isTheme ? '主题' : '插件';
        query('[data-description]').textContent = isTheme ? '管理已安装主题，预览和调整博客外观。' : '管理已安装插件，配置站点的扩展功能。';
        query('[data-header-actions]').innerHTML = isTheme ? button('上传主题','upload','','','upload') + button('获取更多主题','market','','zr-primary','plus') : button('运行时控制台','runtime','','','activity') + button('获取更多插件','market','','zr-primary','plus');
        query('[data-search]').value = state.search;
        query('[data-search]').placeholder = isTheme ? '搜索主题名称、作者…' : '搜索插件名称、服务…';
        query('[data-search]').setAttribute('aria-label', isTheme ? '搜索主题名称、作者' : '搜索插件名称、服务');
        const filters = isTheme ? [['all','全部主题'],['active','已应用'],['preview','预览中'],['system','内置主题'],['removable','可删除']] : [['all','全部插件'],['system','系统插件'],['removable','可卸载']];
        query('[data-filter]').innerHTML = filters.map(([value,label]) => `<option value="${value}">${label}</option>`).join('');
        query('[data-filter]').value = state.filter;
        root.querySelectorAll('[data-page]').forEach(element => {
          if (element.dataset.page === state.page) element.setAttribute('aria-current','page');
          else element.removeAttribute('aria-current');
        });
        renderResults();
      }
      function showDialog(title, content, onConfirm) {
        query('[data-dialog-title]').textContent = title;
        query('[data-dialog-content]').innerHTML = content;
        const confirm = query('[data-confirm]');
        if (confirm) confirm.addEventListener('click', () => { query('[data-dialog]').close(); if (onConfirm) onConfirm(); });
        query('[data-dialog]').showModal();
        icons();
      }
      function showDestination(title, description) {
        showDialog(title, `<p class="zr-description">${description}</p><div class="zr-actions"><button type="button" class="zr-button zr-primary" data-confirm>返回</button></div>`);
      }
      query('[data-search]').addEventListener('input', event => { state.search = event.target.value; renderResults(); });
      query('[data-filter]').addEventListener('change', event => { state.filter = event.target.value; renderResults(); });
      query('[data-close]').addEventListener('click', () => query('[data-dialog]').close());
      root.addEventListener('click', event => {
        const target = event.target.closest('button');
        if (!target) return;
        if (target.dataset.page) { state.page = target.dataset.page; state.view = state.page === 'themes' ? 'grid' : 'list'; state.filter = 'all'; state.search = ''; renderPage(); return; }
        if (target.dataset.view) { state.view = target.dataset.view; renderResults(); return; }
        if (target.hasAttribute('data-appearance')) { root.style.colorScheme = getComputedStyle(root).colorScheme === 'dark' ? 'light' : 'dark'; return; }
        const action = target.dataset.action;
        if (!action) return;
        const isTheme = state.page === 'themes';
        const item = (isTheme ? themes : plugins).find(entry => entry.id === target.dataset.item);
        if (action === 'clear') { state.search = ''; state.filter = 'all'; renderPage(); }
        else if (action === 'preview' && item) { state.preview = item.id; renderResults(); }
        else if (action === 'apply' && item) {
          showDialog(`应用 ${item.name}`, '<p class="zr-description">应用后，博客将使用该主题。你可以随时切换回其他已安装主题。</p><div class="zr-actions"><button type="button" class="zr-button zr-primary" data-confirm>应用主题</button></div>', () => { themes.forEach(theme => theme.active = theme.id === item.id); state.preview = null; renderResults(); });
        } else if (action === 'config' && item) showDestination(`${item.name} · ${isTheme ? '主题配置' : '插件管理'}`, isTheme ? '此入口进入原有主题配置页面。' : '此入口进入该插件自己的管理页面。');
        else if (action === 'remove' && item) showDestination(`${isTheme ? '删除主题' : '卸载插件'} · ${item.name}`, '正式操作前将显示确认提示。此设计预览不会修改站点数据。');
        else if (action === 'upload') showDestination('上传主题', '此入口展开现有主题安装流程，支持主题包检查与安装。');
        else if (action === 'runtime') showDestination('运行时控制台', '此入口进入现有控制台，查看调度、运行状态、通知与服务。');
        else if (action === 'market') showDestination(isTheme ? '主题中心' : '插件市场', `此入口打开现有${isTheme ? '主题中心' : '插件市场'}，浏览和安装更多扩展。`);
      });
      renderPage();
      if (globalThis.Tweak) {
        const tweak = new Tweak({container:root,onChange:() => {
          root.style.setProperty('--zr-primary', design.accent);
          root.style.setProperty('--zr-primary-fill', design.accent);
          root.style.setProperty('--zr-selected', `color-mix(in srgb, ${design.accent} 10%, var(--zr-surface))`);
          root.style.setProperty('--zr-radius', `${design.radius}px`);
          root.style.setProperty('--zr-space', design.spacing === 'compact' ? '18px' : '24px');
        }});
        tweak.addColorPicker(design,'accent',{label:'主题色',reference:'--zr-primary'});
        tweak.addSlider(design,'radius',{label:'圆角',min:0,max:12,step:2,unit:'px',reference:'--zr-radius'});
        tweak.addSelect(design,'spacing',{label:'页面留白',options:[{label:'舒适',value:'comfortable'},{label:'紧凑',value:'compact'}]});
      }
    })();
  </script>
</div>
