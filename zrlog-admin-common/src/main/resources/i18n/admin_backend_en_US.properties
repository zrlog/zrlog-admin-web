admin.mcp.error.initialize=Invalid initialize parameters
admin.mcp.error.cursor=No more tools
admin.mcp.error.toolCall=Invalid tool call
admin.mcp.error.unknownTool=Unknown tool
admin.mcp.error.method=Method not found
admin.mcp.error.internal=Internal error
