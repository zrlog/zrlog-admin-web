admin.mcp.tools.updateArticle.title=Update article
admin.mcp.tools.updateArticle.description=Update only the supplied fields, preserving omitted fields. Requires the current version; read again after a version conflict. Changing live articles, publishing or unpublishing requires publishing permission. Markdown supplied without HTML is rendered again
admin.mcp.tools.publishArticle.title=Publish article
admin.mcp.tools.publishArticle.description=Publish an existing article publicly while preserving its body and other editing fields. Requires the current version, article update permission and publishing permission. Returns the saved result and page refresh status
admin.mcp.tools.uploadAttachment.title=Upload attachment
admin.mcp.tools.uploadAttachment.description=Upload client-supplied attachment bytes and return a URL. Use standard Base64, up to 4 MiB. Respects account upload directories and the site upload plugin; does not accept server file paths or remote download URLs
admin.mcp.parameters.id=Article ID
admin.mcp.parameters.version=Article version from the latest read or save; must match the current version
admin.mcp.parameters.offset=Number of items to skip, default 0; use the returned nextOffset for the next page
admin.mcp.parameters.limit=Items per page, default 50, maximum 100
admin.mcp.parameters.title=Article title
admin.mcp.parameters.typeId=Category ID, available from list_categories
admin.mcp.parameters.status=draft saves a draft, private saves a private article, published publishes publicly; an explicit choice is required when creating
admin.mcp.parameters.markdown=Markdown body; omit when updating to preserve it, or provide an empty string to clear it. Selects Markdown editing unless editorType is supplied; regenerates HTML when content is omitted
admin.mcp.parameters.content=HTML body. May accompany Markdown; supplying only this field switches to HTML editing. Required alongside Markdown if the server cannot render Markdown
admin.mcp.parameters.alias=Article URL alias; an empty string lets the server use the article ID
admin.mcp.parameters.digest=Article summary; when empty, publishing uses the current account's automatic summary setting, or the site default if no override is set
admin.mcp.parameters.keywords=Comma-separated article tags
admin.mcp.parameters.thumbnail=Cover URL, such as the URL returned by upload_attachment; an empty string clears it
admin.mcp.parameters.canComment=Whether comments are allowed; defaults to true when creating
admin.mcp.parameters.recommended=Whether the article is recommended; defaults to false when creating
admin.mcp.parameters.editorType=Editing format: markdown or html; defaults to markdown when creating
admin.mcp.parameters.filename=Filename including its extension, without a directory
admin.mcp.parameters.data=Standard Base64-encoded attachment bytes, without a data URL prefix
